<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora da Reforma — Mesquita Barreto</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap");
  @import url("https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900&display=swap");
  :root{
    --bg-primary:#121212; --bg-secondary:#1e1e1e; --bg-tertiary:#292830;
    --white:#fff; --text:#e0e0e0; --text-2:#b0b0b0; --text-gray:#797979; --text-gray-3:#d8d8d8;
    --border-1:#504f4f; --border-2:#888888; --green:#25d366;
    --font-1:"Merriweather"; --font-2:"Lato";
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-2);background:var(--bg-secondary);color:var(--text-2);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;}
  .app{width:100%;max-width:680px;}
  .header{text-align:center;margin-bottom:34px;}
  .kicker{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--text-gray);font-weight:700;}
  .logo-spot{width:64px;height:64px;border:1px solid var(--border-2);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:1px;
    color:var(--text-gray);margin:0 auto 18px;text-align:center;line-height:1.2;}
  h1{font-family:var(--font-1);font-size:36px;font-weight:700;line-height:1.18;margin:12px 0 10px;color:var(--white);}
  .sub{font-size:16px;font-weight:300;color:var(--text-2);line-height:1.55;max-width:560px;margin:0 auto;}
  .card{background:var(--bg-primary);border:1px solid var(--border-1);border-radius:14px;padding:38px 34px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .progress{height:5px;background:var(--bg-tertiary);border-radius:3px;margin-bottom:32px;overflow:hidden;}
  .bar{height:100%;background:var(--green);width:0%;transition:width .4s ease;border-radius:3px;}
  .step-count{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-gray);margin-bottom:14px;font-weight:700;}
  .question{font-family:var(--font-1);font-size:26px;font-weight:700;line-height:1.25;margin-bottom:26px;color:var(--white);}
  .options{display:flex;flex-direction:column;gap:13px;}
  .opt{background:var(--bg-secondary);border:1px solid var(--border-1);border-radius:10px;padding:18px 22px;
    font-size:16px;font-weight:400;color:var(--text);cursor:pointer;transition:all .18s;text-align:left;font-family:var(--font-2);}
  .opt:hover{border-color:var(--border-2);background:var(--bg-tertiary);transform:translateY(-1px);}
  .opt.sel{border-color:var(--green);background:rgba(37,211,102,0.10);color:var(--white);}
  .nav{display:flex;justify-content:space-between;margin-top:30px;align-items:center;}
  .btn{font-family:var(--font-2);font-size:15px;font-weight:700;letter-spacing:.5px;padding:14px 30px;border-radius:8px;cursor:pointer;border:none;transition:all .18s;}
  .btn-primary{background:var(--green);color:#0a2a14;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-primary:disabled{background:var(--bg-tertiary);color:var(--text-gray);cursor:not-allowed;}
  .btn-back{background:none;color:var(--text-gray);}
  .btn-back:hover{color:var(--text);}
  .result-tier{font-family:var(--font-1);font-size:28px;font-weight:700;color:var(--white);margin-bottom:8px;line-height:1.25;}
  .result-body{font-size:16px;font-weight:300;line-height:1.6;color:var(--text);margin-bottom:20px;}
  .result-points{list-style:none;margin:20px 0;}
  .result-points li{padding:12px 0 12px 30px;position:relative;font-size:16px;font-weight:300;line-height:1.5;color:var(--text);border-bottom:1px solid rgba(80,79,79,0.4);}
  .result-points li::before{content:"\203A";position:absolute;left:4px;color:var(--green);font-size:22px;line-height:1.3;font-weight:700;}
  .cta-row{display:flex;flex-direction:column;gap:12px;margin-top:26px;}
  .cta-wa{background:var(--green);color:#0a2a14;text-align:center;padding:17px;border-radius:9px;font-weight:700;font-size:16px;text-decoration:none;letter-spacing:.3px;}
  .cta-wa:hover{filter:brightness(1.1);}
  .btn-restart{background:none;border:none;color:var(--text-gray);font-family:var(--font-2);font-size:14px;cursor:pointer;text-decoration:underline;margin-top:4px;}
  .btn-restart:hover{color:var(--text);}
  .disclaimer{font-size:12.5px;font-weight:300;color:var(--text-gray);line-height:1.5;margin-top:26px;padding-top:18px;border-top:1px solid var(--border-1);}
  .brandfoot{text-align:center;margin-top:26px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-gray);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo-spot">[ LOGO ]</div>
    <div class="kicker">Reforma Tributária</div>
    <h1>Como a reforma afeta a sua empresa?</h1>
    <p class="sub">Responda 5 perguntas rápidas e receba uma estimativa gratuita do impacto — e do que dá para fazer agora.</p>
  </div>
  <div class="card">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="quiz"></div>
  </div>
  <div class="brandfoot">Mesquita Barreto Advocacia Empresarial</div>
</div>
<script>
// ===== CONFIGURACAO: troque pelo numero de WhatsApp do escritorio (so numeros, com DDD e 55) =====
const WHATSAPP = "5585996135771";
// ================================================================================================

const questions = [
  { q:"Qual o setor principal da sua empresa?",
    opts:["Comércio (venda de produtos)","Indústria / produção","Serviços","Mais de um setor"] },
  { q:"Qual o faturamento aproximado por ano?",
    opts:["Até R$ 360 mil (pequeno)","R$ 360 mil a R$ 4,8 milhões","Acima de R$ 4,8 milhões","Prefiro não informar"] },
  { q:"Qual o regime tributário atual?",
    opts:["Simples Nacional","Lucro Presumido","Lucro Real","Não sei / informal"] },
  { q:"Sua empresa vende principalmente para:",
    opts:["Outras empresas","Consumidor final","Tanto empresas quanto consumidor final","Não sei dizer"] },
  { q:"Hoje, sua empresa emite nota fiscal em:",
    opts:["Todas as vendas","A maioria das vendas","Algumas vendas","Raramente / não emite"] },
];
let step=0; const answers=[];
const quiz=document.getElementById('quiz'); const bar=document.getElementById('bar');

function renderQuestion(){
  const item=questions[step];
  bar.style.width=((step)/(questions.length))*100+'%';
  quiz.innerHTML=
    '<div class="step-count">Pergunta '+(step+1)+' de '+questions.length+'</div>'+
    '<div class="question">'+item.q+'</div>'+
    '<div class="options" id="opts"></div>'+
    '<div class="nav">'+
      (step>0?'<button class="btn btn-back" id="back">← Voltar</button>':'<span></span>')+
      '<button class="btn btn-primary" id="next" disabled>Continuar →</button>'+
    '</div>';
  const optsEl=document.getElementById('opts');
  item.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(answers[step]===i?' sel':'');
    b.textContent=o;
    b.onclick=()=>{answers[step]=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('next').disabled=false;};
    optsEl.appendChild(b);
  });
  if(answers[step]!==undefined)document.getElementById('next').disabled=false;
  document.getElementById('next').onclick=()=>{step++; step<questions.length?renderQuestion():renderResult();};
  if(step>0)document.getElementById('back').onclick=()=>{step--;renderQuestion();};
}

function renderResult(){
  bar.style.width='100%';
  const setor=answers[0],regime=answers[2],publico=answers[3],nota=answers[4];
  let tier,body,points=[];
  const vendeEmpresas=(publico===0||publico===2);
  const notaBaixa=(nota>=2);
  if(notaBaixa&&vendeEmpresas){
    tier="Atenção: risco alto na transição";
    body="Sua empresa vende para outras empresas, mas ainda não emite nota em todas as vendas. No novo sistema, isso pode fazer você perder clientes — porque eles deixam de ganhar crédito ao comprar de você.";
    points=["Risco de perder competitividade frente a concorrentes formalizados","Oportunidade de se adequar agora, antes da cobrança cheia","Possível economia ao escolher o regime tributário certo"];
  }else if(notaBaixa){
    tier="Atenção: hora de se formalizar";
    body="Sua empresa ainda não emite nota em todas as vendas. A reforma aperta o cerco sobre a informalidade ao longo da transição — e quem se organiza cedo paga menos para se adequar.";
    points=["Risco crescente de autuação durante a transição","Janela para formalizar de forma planejada e econômica","Revisão do regime pode reduzir a carga de imposto"];
  }else if(regime===2||setor===1){
    tier="Oportunidade: créditos a aproveitar";
    body="Pelo seu perfil, sua empresa provavelmente terá direito a créditos relevantes no novo sistema (IBS e CBS). O risco aqui é o oposto: deixar crédito na mesa por falta de organização.";
    points=["Potencial de aproveitar créditos que reduzem o imposto","Necessidade de revisar processos e fornecedores","Vantagem competitiva para quem se estruturar primeiro"];
  }else{
    tier="Sua empresa precisa de um plano de transição";
    body="Pelo seu perfil, a reforma traz mudanças que pedem atenção: novas regras de imposto, créditos e obrigações que mudam ano a ano até 2033. Quem acompanha de perto evita surpresas.";
    points=["Mudanças graduais que exigem acompanhamento contínuo","Possível revisão de regime para pagar menos","Planejamento evita pagar imposto a mais sem perceber"];
  }
  const wppMsg=encodeURIComponent("Olá! Fiz a calculadora da reforma no site e gostaria de um diagnóstico para minha empresa. Meu resultado foi: "+tier);
  quiz.innerHTML=
    '<div class="step-count">Sua análise</div>'+
    '<div class="result-tier">'+tier+'</div>'+
    '<p class="result-body">'+body+'</p>'+
    '<ul class="result-points">'+points.map(p=>'<li>'+p+'</li>').join('')+'</ul>'+
    '<div class="result-body" style="font-size:16px;">O próximo passo é um diagnóstico completo — feito por um advogado, com os números reais da sua empresa.</div>'+
    '<div class="cta-row"><a class="cta-wa" href="https://wa.me/'+WHATSAPP+'?text='+wppMsg+'" target="_blank" rel="noopener">Falar com o escritório no WhatsApp</a>'+
    '<button class="btn-restart" id="restart">↺ Refazer a análise</button></div>'+
    '<p class="disclaimer">Este resultado é uma estimativa de caráter informativo e educativo, gerada a partir das suas respostas. Não constitui consulta ou parecer jurídico, nem apuração fiscal, e não substitui a análise individualizada de um profissional. Cada caso exige avaliação específica.</p>';
  document.getElementById('restart').onclick=()=>{step=0;answers.length=0;renderQuestion();};
}
renderQuestion();
</script>
</body>
</html>
